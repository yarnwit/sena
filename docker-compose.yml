name: sena

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sena-backend:latest
    container_name: sena-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sena-frontend:latest
    container_name: sena-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
