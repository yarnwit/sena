services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sena-backend:latest
    container_name: sena-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000

  frontend:
    build:
      context: ./frontend/release
      dockerfile: Dockerfile
    image: sena-frontend:latest
    container_name: sena-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
