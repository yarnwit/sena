stages:
  - deploy

deploy_to_local_docker:
  stage: deploy
  tags:
    - local-docker
  rules:
    # Trigger เฉพาะเมื่อมีการ push หรือ merge เข้า branch develop เท่านั้น
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      Write-Host "=========================================="
      Write-Host "Starting Auto-Deploy to Local Docker Desktop"
      Write-Host "Branch: $env:CI_COMMIT_REF_NAME | Commit: $env:CI_COMMIT_SHORT_SHA"
      Write-Host "=========================================="
      
      if (-not (Test-Path "backend\.env") -and (Test-Path "backend\.env.example")) {
        Copy-Item "backend\.env.example" "backend\.env"
        Write-Host "Created backend\.env from example"
      }
      
      if (-not (Test-Path "frontend\.env") -and (Test-Path "frontend\.env.example")) {
        Copy-Item "frontend\.env.example" "frontend\.env"
        Write-Host "Created frontend\.env from example"
      }
      
      Write-Host "Stopping old containers..."
      docker compose down --remove-orphans
      
      Write-Host "Building latest docker images..."
      docker compose build
      
      Write-Host "Starting containers..."
      docker compose up -d --force-recreate
      
      Write-Host "=========================================="
      Write-Host "Deployment completed successfully!"
      docker ps --filter "name=sena-"
      Write-Host "=========================================="

  # ส่งแจ้งเตือนเข้า LINE OA หลังจบงาน (ไม่ว่าจะ Deploy ผ่านหรือพัง ก็จะส่งสถานะแจ้งเตือน)
  after_script:
    - |
      if (-not $env:LINE_CHANNEL_ACCESS_TOKEN -or -not $env:LINE_USER_ID) {
        Write-Host "LINE Notification skipped: Missing LINE_CHANNEL_ACCESS_TOKEN or LINE_USER_ID."
        exit 0
      }

      $statusEmoji = if ($env:CI_JOB_STATUS -eq "success") { "✅ [SUCCESS] Deploy สำเร็จ!" } else { "❌ [FAILED] Deploy ล้มเหลว!" }

      $messageText = @"
      $statusEmoji
      ========================
      📦 Project: $env:CI_PROJECT_NAME
      🌿 Branch: $env:CI_COMMIT_REF_NAME
      👤 Author: $env:CI_COMMIT_AUTHOR
      📝 Message: $env:CI_COMMIT_TITLE
      🔗 Commit: $env:CI_COMMIT_SHORT_SHA
      ⏱️ Status: $env:CI_JOB_STATUS
      🌐 Pipeline: $env:CI_PIPELINE_URL
      "@

      $headers = @{
        "Authorization" = "Bearer $env:LINE_CHANNEL_ACCESS_TOKEN"
        "Content-Type"  = "application/json; charset=utf-8"
      }

      $payload = @{
        to = $env:LINE_USER_ID
        messages = @(
          @{
            type = "text"
            text = $messageText
          }
        )
      } | ConvertTo-Json -Depth 3

      try {
        $response = Invoke-RestMethod -Uri "https://api.line.me/v2/bot/message/push" `
                                      -Method Post `
                                      -Headers $headers `
                                      -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))
        Write-Host "LINE Notification sent successfully."
      } catch {
        Write-Host "Failed to send LINE notification: $_"
      }
