stages:
  - verify
  - build
  - test
  - deploy

verify_code:
  stage: verify
  tags:
    - local-docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      Write-Host "=========================================="
      Write-Host "🔍 Starting Code Verification (Verify Stage)"
      Write-Host "Branch: $env:CI_COMMIT_REF_NAME | Commit: $env:CI_COMMIT_SHORT_SHA"
      Write-Host "=========================================="

      # 1. ตรวจสอบ Backend (TypeScript Type Check)
      Write-Host "Checking Backend TypeScript..."
      Set-Location backend
      npm ci
      npx tsc --noEmit
      if ($LASTEXITCODE -ne 0) {
        Set-Location ..
        throw "Backend TypeScript check failed!"
      }
      Set-Location ..

      # 2. ตรวจสอบ Frontend (ESLint & TypeScript Type Check)
      Write-Host "Checking Frontend Lint & TypeScript..."
      Set-Location frontend
      npm ci
      npm run lint
      if ($LASTEXITCODE -ne 0) {
        Set-Location ..
        throw "Frontend Lint check failed!"
      }
      npx tsc --noEmit
      if ($LASTEXITCODE -ne 0) {
        Set-Location ..
        throw "Frontend TypeScript check failed!"
      }
      Set-Location ..

      Write-Host "=========================================="
      Write-Host "✅ All code verifications passed!"
      Write-Host "=========================================="

build_apps:
  stage: build
  tags:
    - local-docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      Write-Host "=========================================="
      Write-Host "📦 Starting Application Build (Build Stage)"
      Write-Host "Branch: $env:CI_COMMIT_REF_NAME | Commit: $env:CI_COMMIT_SHORT_SHA"
      Write-Host "=========================================="

      # เตรียมไฟล์ .env สำหรับการ Build
      if (-not (Test-Path "backend\.env") -and (Test-Path "backend\.env.example")) {
        Copy-Item "backend\.env.example" "backend\.env"
      }
      if (-not (Test-Path "frontend\.env") -and (Test-Path "frontend\.env.example")) {
        Copy-Item "frontend\.env.example" "frontend\.env"
      }

      # 1. Build Backend (TypeScript -> dist/)
      Write-Host "Building Backend (Express.js)..."
      Set-Location backend
      npm ci
      npm run build
      if ($LASTEXITCODE -ne 0) {
        Set-Location ..
        throw "Backend build failed!"
      }
      Set-Location ..

      # 2. Build Frontend (Next.js -> .next/)
      Write-Host "Building Frontend (Next.js)..."
      Set-Location frontend
      npm ci
      npm run build
      if ($LASTEXITCODE -ne 0) {
        Set-Location ..
        throw "Frontend build failed!"
      }
      Set-Location ..

      Write-Host "=========================================="
      Write-Host "✅ Application build completed successfully!"
      Write-Host "=========================================="
  artifacts:
    name: "build-artifacts-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      - backend/dist/
      - frontend/.next/

run_e2e_tests:
  stage: test
  tags:
    - local-docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      Write-Host "=========================================="
      Write-Host "🧪 Starting Playwright E2E Tests (Test Stage)"
      Write-Host "Branch: $env:CI_COMMIT_REF_NAME | Commit: $env:CI_COMMIT_SHORT_SHA"
      Write-Host "=========================================="

      # 1. ติดตั้ง Dependencies ใน Root
      Write-Host "Installing Root Dependencies..."
      if (Test-Path "package-lock.json") {
        npm ci
      } else {
        npm install
      }

      # 2. ตรวจสอบและติดตั้ง Chromium Browser สำหรับ Playwright
      Write-Host "Ensuring Playwright Chromium is installed..."
      npx playwright install chromium

      # 3. รัน Automated Playwright Tests (Modern Test Suites: Admin, Resident, Staff)
      Write-Host "Running Playwright Tests..."
      npx playwright test "new_" --project=chromium
      if ($LASTEXITCODE -ne 0) {
        throw "Playwright E2E Tests failed!"
      }

      Write-Host "=========================================="
      Write-Host "✅ All automated tests passed successfully!"
      Write-Host "=========================================="
  artifacts:
    when: always
    name: "playwright-report-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/


deploy_to_local_docker:
  stage: deploy
  tags:
    - local-docker
  rules:
    # Trigger เฉพาะเมื่อมีการ push หรือ merge เข้า branch develop เท่านั้น
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      Write-Host "=========================================="
      Write-Host "Starting Auto-Deploy to Local Docker Desktop"
      Write-Host "Branch: $env:CI_COMMIT_REF_NAME | Commit: $env:CI_COMMIT_SHORT_SHA"
      Write-Host "=========================================="
      
      if (-not (Test-Path "backend\.env") -and (Test-Path "backend\.env.example")) {
        Copy-Item "backend\.env.example" "backend\.env"
        Write-Host "Created backend\.env from example"
      }
      
      if (-not (Test-Path "frontend\.env") -and (Test-Path "frontend\.env.example")) {
        Copy-Item "frontend\.env.example" "frontend\.env"
        Write-Host "Created frontend\.env from example"
      }
      
      Write-Host "Stopping old containers..."
      docker compose down --remove-orphans
      
      Write-Host "Building latest docker images..."
      docker compose build
      
      Write-Host "Starting containers..."
      docker compose up -d --force-recreate
      
      Write-Host "=========================================="
      Write-Host "Deployment completed successfully!"
      docker ps --filter "name=sena-"
      Write-Host "=========================================="

  # ส่งแจ้งเตือนเข้า LINE OA หลังจบงาน (ไม่ว่าจะ Deploy ผ่านหรือพัง ก็จะส่งสถานะแจ้งเตือน)
  after_script:
    - |
      if (-not $env:LINE_CHANNEL_ACCESS_TOKEN -or -not $env:LINE_USER_ID) {
        Write-Host "LINE Notification skipped: Missing LINE_CHANNEL_ACCESS_TOKEN or LINE_USER_ID."
        exit 0
      }

      $statusEmoji = if ($env:CI_JOB_STATUS -eq "success") { "✅ [SUCCESS] Deploy สำเร็จ!" } else { "❌ [FAILED] Deploy ล้มเหลว!" }

      $messageText = @"
      $statusEmoji
      ========================
      📦 Project: $env:CI_PROJECT_NAME
      🌿 Branch: $env:CI_COMMIT_REF_NAME
      👤 Author: $env:CI_COMMIT_AUTHOR
      📝 Message: $env:CI_COMMIT_TITLE
      🔗 Commit: $env:CI_COMMIT_SHORT_SHA
      ⏱️ Status: $env:CI_JOB_STATUS
      🌐 Pipeline: $env:CI_PIPELINE_URL
      "@

      $headers = @{
        "Authorization" = "Bearer $env:LINE_CHANNEL_ACCESS_TOKEN"
        "Content-Type"  = "application/json; charset=utf-8"
      }

      $payload = @{
        to = $env:LINE_USER_ID
        messages = @(
          @{
            type = "text"
            text = $messageText
          }
        )
      } | ConvertTo-Json -Depth 3

      try {
        $response = Invoke-RestMethod -Uri "https://api.line.me/v2/bot/message/push" `
                                      -Method Post `
                                      -Headers $headers `
                                      -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))
        Write-Host "LINE Notification sent successfully."
      } catch {
        Write-Host "Failed to send LINE notification: $_"
      }
